services:
  - type: web
    name: apollo-fitness-ai
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python run_web.py
    envVars:
      - key: PORT
        value: 10000
      - key: HOST
        value: 0.0.0.0
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DEVWORLD_BASE_URL
        value: https://api.devworld.com.br/v1
